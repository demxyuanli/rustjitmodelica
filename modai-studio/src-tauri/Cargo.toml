[package]
name = "modai-studio"
version = "0.1.0"
description = "Modai Studio - Modelica visual modeling and simulation"
authors = ["rustmodlica"]
edition = "2021"

[lib]
name = "modai_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustmodlica = { path = "../../jit-compiler" }
rfd = "0.14"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
zip = "2"
libloading = "0.8"
regex = "1"
